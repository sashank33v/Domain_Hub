<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomainHub - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] font-sans min-h-screen">
    <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur border-b border-slate-100">
        <div class="max-w-7xl mx-auto h-16 flex items-center justify-between px-4 sm:px-6">
            <a href="dashboard.html" class="flex items-center gap-3 font-semibold text-lg">
                <span class="w-9 h-9 rounded-lg bg-[#3525cd] text-white flex items-center justify-center"><span class="material-symbols-outlined">language</span></span>
                DomainHub
            </a>
            <div class="flex items-center gap-3">
                <span id="user-email" class="hidden sm:block text-sm text-slate-500"></span>
                <button id="logoutButton" class="text-sm font-semibold text-slate-700 hover:text-red-600">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 pb-10">
        <section class="mb-8">
            <h1 class="text-3xl font-bold">Dashboard</h1>
            <p class="mt-2 text-slate-500">Overview of your domain portfolio.</p>
        </section>

        <section class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100"><p class="text-sm text-slate-500">Total Domains</p><p id="stat-total" class="text-4xl font-bold mt-3">—</p></div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100"><p class="text-sm text-slate-500">Active</p><p id="stat-active" class="text-4xl font-bold mt-3 text-emerald-600">—</p></div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100"><p class="text-sm text-slate-500">Expiring Soon</p><p id="stat-expiring" class="text-4xl font-bold mt-3 text-amber-600">—</p></div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100"><p class="text-sm text-slate-500">Expired</p><p id="stat-expired" class="text-4xl font-bold mt-3 text-red-600">—</p></div>
        </section>

        <section class="mt-8 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold">Quick Actions</h2>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <a href="manage-domains.html" class="flex-1 rounded-lg bg-[#3525cd] text-white px-4 py-3 text-center font-semibold">Add Domain</a>
                <a href="domains.html" class="flex-1 rounded-lg bg-slate-100 text-slate-800 px-4 py-3 text-center font-semibold">Manage Domains</a>
            </div>
        </section>

        <section class="mt-8 bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 flex items-center justify-between">
                <h2 class="text-lg font-semibold">Current Domains</h2>
                <a href="domains.html" class="text-sm font-semibold text-[#3525cd]">View all</a>
            </div>
            <div id="dashboard-domains" class="divide-y divide-slate-100">
                <div class="p-5 text-slate-500">Loading...</div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireAuth()) return;

            document.getElementById("user-email").textContent = getUserEmail();
            document.getElementById("logoutButton").addEventListener("click", logout);

            try {
                const [allResult, activeResult, expiredResult] = await Promise.all([
                    getDomains({ page: 1, limit: 100 }),
                    getDomains({ page: 1, limit: 100, status: "ACTIVE" }),
                    getDomains({ page: 1, limit: 100, status: "EXPIRED" })
                ]);

                document.getElementById("stat-total").textContent = allResult.pagination?.total ?? 0;
                document.getElementById("stat-active").textContent = activeResult.pagination?.total ?? 0;
                document.getElementById("stat-expired").textContent = expiredResult.pagination?.total ?? 0;

                const allDomains = allResult.data || [];
                const today = new Date();
                const expiringCount = allDomains.filter(domain => {
                    if (domain.status !== "ACTIVE") return false;
                    const expiry = new Date(domain.expiry_date);
                    const days = (expiry - today) / 86400000;
                    return days >= 0 && days <= 30;
                }).length;

                document.getElementById("stat-expiring").textContent = expiringCount;

                const recent = document.getElementById("dashboard-domains");
                if (!allDomains.length) {
                    recent.innerHTML = '<div class="p-5 text-slate-500">No domains found.</div>';
                } else {
                    recent.innerHTML = allDomains.slice(0, 5).map(domain => `
                        <div class="p-5 flex items-center justify-between gap-4">
                            <div>
                                <p class="font-semibold">${escapeHtml(domain.domain_name)}</p>
                                <p class="text-sm text-slate-500">${escapeHtml(domain.registrar)}</p>
                            </div>
                            <div class="text-right">
                                <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold ${domain.status === 'ACTIVE' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">${domain.status}</span>
                                <p class="text-xs text-slate-500 mt-1">${formatDisplayDate(domain.expiry_date)}</p>
                            </div>
                        </div>
                    `).join("");
                }
            } catch (error) {
                document.getElementById("dashboard-domains").innerHTML = `<div class="p-5 text-red-600">${escapeHtml(error.message)}</div>`;
            }
        });

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
        }
    </script>
</body>
</html>
